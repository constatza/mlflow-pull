[project]
name = "mlflow-pull"
version = "0.1.0"
description = "Download the artifacts of an MLflow run, its nested runs, or a whole experiment."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mlflow-skinny>=2.10"]

[project.scripts]
mlflow-pull = "mlflow_pull:main"

[dependency-groups]
dev = ["mlflow>=2.10", "pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlflow_pull"]
