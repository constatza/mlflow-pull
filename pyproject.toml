[project]
name = "mlflow-pull"
version = "0.1.0"
description = "Download the artifacts of an MLflow run, its nested runs, or a whole experiment."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mlflow-skinny>=3.7",
    "typer>=0.29.1",
]

[project.scripts]
mlpull = "mlflow_pull:app"

[dependency-groups]
dev = ["mlflow[auth]>=3.7", "pytest>=8"]

[tool.pytest.ini_options]
markers = ["slow: starts a real mlflow server"]
addopts = "-m 'not slow'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlflow_pull"]
